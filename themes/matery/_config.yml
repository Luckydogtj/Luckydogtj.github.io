# ---------- 关于页个人信息 ----------
profile:
  avatar: /medias/dog/avatar.svg
  career: 电气工程 / 控制科学与工程
  introduction: 聚焦构网型储能并网稳定性、柔性直流宽频振荡抑制与永磁电机设计，致力于电力电子与新能源并网领域的科研探索与工程实践。

# ---------- 关于页：我的项目（严格依据简历） ----------
myProjects:
  enable: true
  data:
    构网型储能海上风电柔直系统宽频振荡抑制:
      featured: true
      icon: fas fa-battery-full
      iconBackground: 'linear-gradient(135deg, #1565c0 0%, #0d47a1 100%)'
      url: /research/gfm-storage
      demoUrl:
      githubUrl:
      desc: 国家自然科学基金项目（2026.01—至今）。建立风电及构网型储能变流器并网系统阻抗模型，设计基于并网电流反馈的虚拟阻抗控制，实现强电网下振荡抑制（振荡抑制效果良好（具体指标待授权））。
      shortDesc: 构网型储能变流器阻抗建模与虚拟阻抗振荡抑制。
      label: '国家自然科学基金项目'
      highlight: '阻抗建模 · 虚拟阻抗控制'
      tech:
        - 构网型储能
        - 阻抗建模
        - 虚拟阻抗
        - MATLAB
    多端特高压柔直源网交互宽频振荡抑制:
      featured: true
      icon: fas fa-broadcast-tower
      iconBackground: 'linear-gradient(135deg, #00838f 0%, #006064 100%)'
      url: /research/uhvdc-oscillation
      demoUrl:
      githubUrl:
      desc: 国家电网总部科技项目（2024.09—2025.12）。参与 VMD-MSST-HHT 振荡辨识与振源分析设计、CCF+改进 C 型滤波器方案的硬件实验验证，改进型阻尼方案损耗有所改善（具体数值待授权）。
      shortDesc: 宽频振荡辨识与改进 C 型滤波器阻尼方案验证。
      label: '国家电网总部科技项目'
      highlight: '振荡辨识 · 阻尼优化'
      tech:
        - VMD-MSST-HHT
        - CCF
        - C 型滤波器
        - 硬件实验
    纯电动汽车用轮毂电机研究:
      featured: true
      icon: fas fa-cog
      iconBackground: 'linear-gradient(135deg, #6a1b9a 0%, #4527a0 100%)'
      url: /projects/hub-motor
      demoUrl:
      githubUrl:
      desc: 个人项目（2023.09—2024.06）。完成 40 kW、24 极 27 槽外转子永磁同步电机电磁设计，基于 ANSYS Maxwell 有限元分析与磁热耦合仿真，输出转矩 208 N·m、转矩脉动 < 5%。
      shortDesc: 40 kW 轮毂永磁同步电机电磁设计与磁热耦合分析。
      label: '个人项目'
      highlight: '电磁设计 · 磁热耦合'
      tech:
        - ANSYS Maxwell
        - Workbench
        - MTPA/MTPV
        - 效率 Map

# ---------- 关于页：我的技能（依据简历） ----------
